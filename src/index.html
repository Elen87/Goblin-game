
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔨 Поймай гоблина!</title>
</head>
<body>
    <div class="container">
        <h1>🔨 Поймай гоблина!</h1>
        <div class="stats">
            <div class="score">🏆 Счёт: <span id="score">0</span></div>
            <div class="misses">💀 Промахи: <span id="misses">0</span></div>
        </div>
        <div class="game-board" id="game-board"></div>
        <button id="reset-btn" class="reset-btn">🔄 Начать заново</button>
        <div class="instructions">
            <p>🎯 Гоблин появляется на 1 секунду в случайной ячейке</p>
            <p>🔨 Успей ударить молотком, чтобы заработать очко!</p>
            <p>💀 После 5 промахов игра заканчивается</p>
        </div>
    </div>
</body>
</html>
